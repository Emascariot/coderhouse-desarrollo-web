     <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">

            <a class="navbar-brand" href="#">Emanuel</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">

                </ul>

</header>

<main>
    <h1 class="titulo">Mi primera página web</h1>
    
    <section class="contenedor-proyectos">
        <!-- CARRUSEL DE BOOTSTRAP -->
        <div id="carruselPrincipal" class="carousel slide"
            data-bs-autoplay="true"
            data-bs-interval="3000">

            <!-- IMÁGENES -->
            <div class="carousel-inner">
            
                <!-- IMAGEN ORIGINAL -->
                <div class="carousel-item active">
                    <img src="./imagenes/golf.jfif" class="d-block w-100" alt="Golf">
                </div>
            
                <!-- SEGUNDA IMAGEN -->
                <div class="carousel-item">
                    <img src="./imagenes/carrusell1.jpg" class="d-block w-100" alt="Golf 2">
                </div>
            
                <!-- TERCERA IMAGEN -->
                <div class="carousel-item">
                    <img src="./imagenes/carrusell2.jpg" class="d-block w-100" alt="Golf 3">
                </div>
            
            </div>

            <!-- CONTROLES -->
            <div class="d-flex justify-content-center gap-3 mt-2">
            
                <button class="btn-icon btn-sm" type="button"
                    data-bs-target="#carruselPrincipal"
                    data-bs-slide="prev">
            
                    <span class="carousel-icon-prev"></span>
                </button>
            
                <button class="btn-icon btn-sm" type="button"
                    data-bs-target="#carruselPrincipal"
                    data-bs-slide="next">
            
                    <span class="carousel-icon-next"></span>
                </button>
            
            </div>
        
        </div>
        <article class="proyecto-uno">
            <h2 class="texto-general">Elaborando mi primer proyecto</h2>
            <p class="texto-general">En prueba</p>
        </article>
    </section>
